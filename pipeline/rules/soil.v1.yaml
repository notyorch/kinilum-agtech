# Profundidad efectiva de raíz por tipo de suelo declarado — versión soil.v1
#
# Para FAO-56 la profundidad de raíz sale de lo que declara el técnico, NO de SoilGrids (AGENTS.md §4).
# Ningún tipo de suelo de Guasave tiene hoy un rango con fuente: la profundidad queda «sin dato» hasta que el
# técnico la mida en campo (`root_depth_cm` en pipeline/parcels/<id>.yaml), que reemplaza al rango. Cuando haya
# una fuente local, se pone aquí como [mínimo, máximo] en cm.

rules_version: soil.v1
fuente: null
validado_por: null
method: assumed
estado_evidencia: a_validar

# tipo declarado → [mínimo, máximo] en cm; null = sin rango definido (sin dato)
profundidad_raiz_cm:
  alluvial: null      # valle aluvial (riego): sin rango definido
  undeclared: null    # sin declarar: sin rango definido

nombre:
  alluvial: "Aluvial"
  undeclared: "Sin declarar"

# Supuestos del contrato que arrastra cada tipo (enum Assumption de shared/schema).
supuestos:
  alluvial: [teamAssumption]
  undeclared: [teamAssumption]
