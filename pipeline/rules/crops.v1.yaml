# Catálogo de cultivos de rotación — versión crops.v1
#
# Qué cultivos se comparan con el maíz y con qué reglas. Es la fuente de verdad:
# la app lleva un espejo en app/src/data/crops.ts y restrictions.ts, y una prueba
# (app/tests/data.test.mjs) falla si dejan de decir lo mismo.
#
# NADA aquí está validado todavía. `null` significa «por definir»: se llena con
# el técnico y una fuente citada. Si falta un parámetro, el criterio que lo
# necesita se declara «sin dato»; nunca se rellena con un valor inventado.
# No se simulan más cultivos de rotación que estos cuatro.

rules_version: crops.v1
fuente: null            # cita de cada valor cuando exista
validado_por: null      # nombre del técnico que lo revisó
method: assumed         # supuestos del equipo mientras no haya fuente

cultivos:
  frijol:
    tipo: leguminosa
    estrategia: E2
    fija_nitrogeno: true
    exige_maquinaria: false
    requiere_venta: true      # regla de ejemplo ya existente
    ciclo_dias: null
    estado_evidencia: a_validar
    variante_por_defecto: xpelon
    # Cada variante es un perfil completo, no una etiqueta. La elige el técnico
    # en pipeline/parcels/<id>.yaml (campo frijol_variante). El paquete lleva
    # solo la variante elegida.
    variantes:
      xpelon:
        nombre: Xpelón
        que_es: frijol yucateco de caupí
        nombre_cientifico: Vigna unguiculata   # a revisar con el técnico antes de publicarlo
        kc_por_etapa: { inicial: null, media: null, final: null }
        profundidad_raiz_m: null
        ventana_siembra: null      # la da el técnico
        ciclo_dias: null           # la da el técnico
        umbral_calor_c: null
        rendimiento_t_ha: null
        precio_mxn_t: null
        # Hipótesis del equipo, sin fuente: no se usa para ordenar con peso fuerte.
        tolerancia_calor_sequia:
          valor: null
          hipotesis: mayor que la de ib y negro
          usa_en_orden: false
          estado_evidencia: a_validar
        estado_evidencia: a_validar
      ib:
        nombre: Ib
        que_es: frijol lima regional
        nombre_cientifico: Phaseolus lunatus   # a revisar con el técnico antes de publicarlo
        kc_por_etapa: { inicial: null, media: null, final: null }
        profundidad_raiz_m: null
        ventana_siembra: null
        ciclo_dias: null
        umbral_calor_c: null
        rendimiento_t_ha: null
        precio_mxn_t: null
        estado_evidencia: a_validar
      negro:
        nombre: Frijol negro
        que_es: frijol negro
        nombre_cientifico: Phaseolus vulgaris  # a revisar con el técnico antes de publicarlo
        kc_por_etapa: { inicial: null, media: null, final: null }
        profundidad_raiz_m: null
        ventana_siembra: null
        ciclo_dias: null
        umbral_calor_c: null
        rendimiento_t_ha: null
        precio_mxn_t: null
        estado_evidencia: a_validar

  garbanzo:
    tipo: leguminosa
    estrategia: E4
    fija_nitrogeno: true
    exige_maquinaria: null
    requiere_venta: null
    ciclo_dias: null
    kc_por_etapa: { inicial: null, media: null, final: null }
    profundidad_raiz_m: null
    ventana_siembra: null
    umbral_calor_c: null
    rendimiento_t_ha: null
    precio_mxn_t: null
    estado_evidencia: a_validar

  sorgo:
    tipo: cereal
    estrategia: E3
    fija_nitrogeno: false
    exige_maquinaria: true    # regla de ejemplo ya existente
    requiere_venta: true      # regla de ejemplo ya existente
    ciclo_dias: null
    kc_por_etapa: { inicial: null, media: null, final: null }
    profundidad_raiz_m: null
    ventana_siembra: null
    umbral_calor_c: null
    rendimiento_t_ha: null
    precio_mxn_t: null
    estado_evidencia: a_validar

  trigo:
    tipo: cereal
    estrategia: E5
    fija_nitrogeno: false
    exige_maquinaria: null
    requiere_venta: null
    ciclo_dias: null
    kc_por_etapa: { inicial: null, media: null, final: null }
    profundidad_raiz_m: null
    ventana_siembra: null
    umbral_calor_c: null
    rendimiento_t_ha: null
    precio_mxn_t: null
    estado_evidencia: a_validar

# Reglas de restricción. Son filtros (WHERE), no pesos: una estrategia que no
# cumple no se oculta; va al final con su razón. Todas son hipótesis.
reglas:
  - id: no_aceptado
    que_dice: Si el agricultor no acepta sembrar el cultivo, su estrategia queda fuera.
    excluye: [frijol, garbanzo, sorgo, trigo]
    estado_evidencia: a_validar
    fuente: null
  - id: sin_venta
    que_dice: Sin dónde vender el cultivo, su estrategia queda fuera.
    excluye: [frijol, garbanzo, sorgo, trigo]
    estado_evidencia: a_validar
    fuente: null
    nota: garbanzo y trigo tienen requiere_venta por definir; se aplica como regla de ejemplo.
  - id: sin_maquinaria
    que_dice: Sin tractor ni maquila, la estrategia queda fuera.
    excluye: [sorgo, trigo]
    estado_evidencia: a_validar
    fuente: null
    nota: el trigo tiene exige_maquinaria por definir; se aplica como regla de ejemplo.
  - id: calor_extremo_suelo_delgado
    que_dice: Con calor extremo y suelo delgado, el cultivo se marca «poco viable», con la razón visible.
    marca_poco_viable: [garbanzo, trigo]
    estado_evidencia: a_validar
    fuente: null
